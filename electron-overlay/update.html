<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mise à jour</title>
  <style>
    /* Direction « Obsidienne » — même langage que setup.html */
    @font-face { font-family: 'Chakra Petch'; font-weight: 700; src: url(assets/fonts/chakra-petch-latin-700-normal.woff2) format('woff2'); }
    @font-face { font-family: 'IBM Plex Sans'; font-weight: 400; src: url(assets/fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url(assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2'); }

    :root {
      --ink: #0c1016; --ink-2: #141a23; --cut: #2a323e; --mute: #7f8896; --bone: #eef1f5;
      --chamfer: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

    html, body {
      width: 100vw; height: 100vh;
      background: transparent;
      font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .toast {
      position: fixed; inset: 8px;
      display: flex; flex-direction: column;
      gap: 10px;
      padding: 14px 16px 14px;
      background: rgba(12,16,22,.96);
      border-top: 1px solid rgba(238,241,245,.4);
      clip-path: var(--chamfer);
      animation: slidein .3s cubic-bezier(0.34, 1.1, 0.64, 1);
    }

    @keyframes slidein {
      from { transform: translateY(20px); opacity: 0 }
      to   { transform: translateY(0);    opacity: 1 }
    }

    .toast.hiding { animation: slideout .25s ease forwards; }
    @keyframes slideout {
      to { transform: translateY(20px); opacity: 0 }
    }

    .header { display: flex; align-items: center; gap: 12px; }

    .icon {
      width: 30px; height: 26px;
      flex-shrink: 0;
      color: var(--bone);
    }

    .title-block { flex: 1; min-width: 0; }
    .title {
      font-family: 'Chakra Petch', 'Segoe UI', sans-serif;
      font-size: 12.5px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase;
      color: var(--bone);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .version {
      font-family: 'IBM Plex Mono', Consolas, monospace;
      font-size: 10.5px;
      color: var(--mute);
      margin-top: 2px;
    }

    .close-btn {
      width: 22px; height: 22px;
      border: none;
      background: transparent;
      color: var(--mute);
      cursor: pointer;
      font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s;
      flex-shrink: 0;
    }
    .close-btn:hover { color: var(--bone); }

    .body {
      font-size: 11.5px;
      color: #b9c0ca;
      line-height: 1.5;
    }

    .actions { display: flex; gap: 8px; margin-top: 2px; }

    .btn {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid var(--cut);
      font-family: 'Chakra Petch', 'Segoe UI', sans-serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s, color .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:focus-visible { outline: 1px solid var(--bone); outline-offset: 2px; }

    .btn-primary { background: var(--bone); color: var(--ink); border-color: var(--bone); }
    .btn-primary:hover { background: #fff; }

    .btn-secondary { background: transparent; color: var(--mute); }
    .btn-secondary:hover { color: var(--bone); border-color: var(--mute); }
  </style>
/head>
<body>
  <div class="toast" id="toast">
    <div class="header">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" viewBox="200 160 1200 1000"><g fill="currentColor"><path d="M800 196 L809 330 C817 462 839 557 895 599 C838 631 818 710 800 936 C782 710 762 631 705 599 C761 557 783 462 791 330 Z"/><path d="M244 442 C333 510 430 573 601 742 C514 668 424 633 356 629 Z"/><path d="M498 493 C544 624 672 635 776 1093 C700 898 614 804 526 715 C480 667 461 615 498 493 Z"/><path d="M316 676 C454 670 572 725 682 838 C551 753 444 738 316 676 Z"/><path d="M495 764 C604 800 699 884 773 1101 C699 954 614 845 495 796 Z"/><g transform="translate(1600 0) scale(-1 1)"><path d="M244 442 C333 510 430 573 601 742 C514 668 424 633 356 629 Z"/><path d="M498 493 C544 624 672 635 776 1093 C700 898 614 804 526 715 C480 667 461 615 498 493 Z"/><path d="M316 676 C454 670 572 725 682 838 C551 753 444 738 316 676 Z"/><path d="M495 764 C604 800 699 884 773 1101 C699 954 614 845 495 796 Z"/></g></g><path fill="none" display="none" d="M800 326 L804 780 L800 870 L796 780 Z" opacity=".9"/></svg>
      <div class="title-block">
        <div class="title">Mise à jour prête</div>
        <div class="version" id="version">version inconnue</div>
      </div>
      <button class="close-btn" id="dismiss" title="Plus tard">✕</button>
    </div>
    <div class="body">Une nouvelle version a été téléchargée. Redémarre LiveChat pour l'installer.</div>
    <div class="actions">
      <button class="btn btn-secondary" id="later">Plus tard</button>
      <button class="btn btn-primary"   id="restart">Redémarrer</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')

    ipcRenderer.on('update-info', (event, info) => {
      if (info && info.version) {
        document.getElementById('version').textContent = 'v' + info.version
      }
    })

    function dismiss() {
      const toast = document.getElementById('toast')
      toast.classList.add('hiding')
      setTimeout(() => ipcRenderer.send('update-dismiss'), 240)
    }

    document.getElementById('restart').addEventListener('click', () => {
      ipcRenderer.send('update-restart')
    })
    document.getElementById('dismiss').addEventListener('click', dismiss)
    document.getElementById('later').addEventListener('click',   dismiss)
  </script>
</body>
</html>
